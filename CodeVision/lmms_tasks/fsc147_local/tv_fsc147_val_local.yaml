dataset_path: parquet
dataset_kwargs:
  data_files:
    test: /mnt/cpfs/delinmao/Benchmarks/FSC147/fsc147_val_codevision_eval.parquet
task: tv_fsc147_val_local
test_split: test
output_type: generate_until
doc_to_visual: !function utils.doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: mae
    aggregation: !function utils.aggregate_mae
    higher_is_better: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  - version: 0.1
